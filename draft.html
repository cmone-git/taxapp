<script>
        lucide.createIcons();

        // -------------------------
        // SCRIPT URL 
        // -------------------------
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxY5VHAOIBC2rDv305WJJm-iuKfi9bjxvV-rRhR9E9mJcPeBgMBX6aYw-nbrWcGeQ6C0A/exec';

        // -------------------------
        // APP ROUTER (Single Page App)
        // -------------------------
        function goHome() {
            document.querySelectorAll('.page-modal').forEach(m => { m.classList.add('hidden'); m.classList.remove('flex', 'block'); });
            closeMenu();
            document.getElementById('mainApp').scrollTo(0,0);
        }

        // -------------------------
        // SEQUENTIAL NUMBER GENERATORS (ITR & TRN)
        // -------------------------
        function getNextItrAppNo() {
            let lastNo = parseInt(localStorage.getItem('itrLastSeq') || "0", 10);
            lastNo++;
            localStorage.setItem('itrLastSeq', lastNo.toString());
            const now = new Date();
            const yy = String(now.getFullYear()).slice(-2);
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const seqStr = String(lastNo).padStart(3, '0');
            return `ITR4${yy}${mm}${seqStr}`;
        }

        function getNextTrnNo() {
            let lastNo = parseInt(localStorage.getItem('trnLastSeq') || "0", 10);
            lastNo++;
            localStorage.setItem('trnLastSeq', lastNo.toString());
            const seqStr = String(lastNo).padStart(3, '0');
            return `TRN4${seqStr}`;
        }

        // -------------------------
        // LOCAL STORAGE SESSION & INITIALIZATION
        // -------------------------
        let currentUser = { name: "Guest User", email: "guest@example.com", picture: "" };

        document.addEventListener('DOMContentLoaded', () => {
            const savedSession = localStorage.getItem('taxAppSession');
            if (savedSession) {
                currentUser = JSON.parse(savedSession);
                populateUserData();
            }

            setTimeout(() => {
                const splash = document.getElementById('splash');
                if (splash) { splash.style.opacity = "0"; setTimeout(() => splash.remove(), 500); }
                calculateCountdown();
            }, 1000);
        });

        // -------------------------
        // GOOGLE LOGIN
        // -------------------------
        const GOOGLE_CLIENT_ID = "753272952222-c1pgj8cb8g7vte82sp6kevd3mku17cca.apps.googleusercontent.com"; 

        window.onload = function () {
            try {
                if(typeof google !== 'undefined' && google.accounts && google.accounts.id) {
                    google.accounts.id.initialize({
                        client_id: GOOGLE_CLIENT_ID,
                        callback: handleCredentialResponse,
                        cancel_on_tap_outside: false
                    });
                    google.accounts.id.renderButton(
                        document.getElementById("googleAuthContainer"),
                        { theme: "outline", size: "large", width: 280, text: "continue_with" }
                    );
                }
            } catch (error) { console.warn("Google Sign-In disabled due to local environment constraints."); }
        };

        function parseJwt (token) {
            var base64Url = token.split('.')[1];
            var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            var jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        }

        function handleCredentialResponse(response) {
            const data = parseJwt(response.credential);
            currentUser.name = data.name;
            currentUser.email = data.email;
            currentUser.picture = data.picture;
            
            localStorage.setItem('taxAppSession', JSON.stringify(currentUser));
            
            populateUserData(); closeLoginModal(); logUserSignIn(currentUser.name, currentUser.email);
            showToast("Successfully Logged In", false, true);
        }

        // Email Login with Strict Validation and Session Caching
        function processEmailLogin() {
            const btn = document.getElementById('btnEmailLogin');
            if (btn.disabled) return;
            const email = (document.getElementById('loginEmail').value || "").trim();
            const pass = (document.getElementById('loginPassword').value || "").trim();
            const rememberMe = document.getElementById('rememberMeCheckbox').checked;

            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!email || !emailRegex.test(email)) { 
                showToast("Please enter a valid full email address (e.g., name@gmail.com)", true); 
                return; 
            }
            if (!pass) {
                showToast("Please enter your password", true); 
                return; 
            }
            
            btn.disabled = true;
            btn.innerHTML = `<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> Signing In...`;
            lucide.createIcons();
            
            setTimeout(() => {
                currentUser.name = email.split('@')[0];
                currentUser.email = email.toLowerCase();
                
                if (rememberMe) {
                    localStorage.setItem('taxAppSession', JSON.stringify(currentUser));
                }

                populateUserData();
                closeLoginModal();
                logUserSignIn(currentUser.name, currentUser.email);
                showToast("Successfully Logged In", false, true);
                btn.disabled = false;
                btn.innerHTML = "Sign In";
            }, 1000);
        }

        function togglePassword(inputId, iconId) {
            const input = document.getElementById(inputId); const icon = document.getElementById(iconId);
            if(input.type === 'password') { input.type = 'text'; icon.setAttribute('data-lucide', 'eye-off'); } 
            else { input.type = 'password'; icon.setAttribute('data-lucide', 'eye'); }
            lucide.createIcons();
        }

        function logUserSignIn(name, email) {
            const payload = { "action": "USER_LOGIN", "#TimeStamp": new Date().toISOString(), "Name": name, "Email": email };
            fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload), mode: 'no-cors' }).catch(err => console.error(err));
        }

        function populateUserData() {
            if(currentUser.name !== "Guest User") {
                document.getElementById('navProfileText').innerText = "Profile";
            }
            document.getElementById('s1_name').value = currentUser.name !== "Guest User" ? currentUser.name : "";
            document.getElementById('s1_email').value = currentUser.email !== "guest@example.com" ? currentUser.email : "";

            const initials = currentUser.name.split(' ').map(n => n[0]).join('').substring(0,2).toUpperCase();
            
            if(currentUser.picture) {
                document.getElementById('headerAvatarIcon').parentElement.classList.add('hidden');
                document.getElementById('headerAvatarImg').src = currentUser.picture;
                document.getElementById('headerAvatarImg').classList.remove('hidden');
                document.getElementById('navAvatar').src = currentUser.picture;
                document.getElementById('navAvatar').classList.remove('hidden');
                document.getElementById('navInitials').classList.add('hidden');
            } else {
                document.getElementById('navInitials').innerText = initials;
            }
            document.getElementById('navName').innerText = currentUser.name;
            document.getElementById('navEmail').innerText = currentUser.email;
            document.getElementById('navSignInBtn').classList.add('hidden');
            document.getElementById('navSignOutBtn').classList.remove('hidden');
            document.getElementById('navSignOutBtn').classList.add('flex');
        }

        function handleLogout() {
            localStorage.removeItem('taxAppSession');
            currentUser = { name: "Guest User", email: "guest@example.com", picture: "" };
            
            document.getElementById('navProfileText').innerText = "Login";
            document.getElementById('navName').innerText = currentUser.name;
            document.getElementById('navEmail').innerText = currentUser.email;
            document.getElementById('navInitials').innerText = "GU";
            document.getElementById('navInitials').classList.remove('hidden');
            document.getElementById('navAvatar').classList.add('hidden');
            document.getElementById('headerAvatarImg').classList.add('hidden');
            document.getElementById('headerAvatarIcon').parentElement.classList.remove('hidden');
            document.getElementById('navSignInBtn').classList.remove('hidden');
            document.getElementById('navSignOutBtn').classList.add('hidden');
            document.getElementById('navSignOutBtn').classList.remove('flex');
            
            goHome();
            showToast("Logged out successfully");
        }

        function handleProfileClick() { goHome(); if(currentUser.email !== "guest@example.com") { openMyFilingsModal(); } else { openLoginModal(); } }

        // -------------------------
        // MY FILINGS FETCH LOGIC
        // -------------------------
        function openMyFilingsModal() {
            goHome(); document.getElementById('myFilingsModal').classList.remove('hidden'); document.getElementById('myFilingsModal').classList.add('flex');
            const container = document.getElementById('myFilingsContainer');
            container.innerHTML = `
                <div class="flex flex-col items-center justify-center py-24 text-gray-400">
                    <i data-lucide="loader-2" class="w-10 h-10 animate-spin mb-4"></i>
                    <p class="text-base font-semibold text-gray-600">Loading your records...</p>
                </div>`;
            lucide.createIcons();

            fetch(`${SCRIPT_URL}?action=GET_USER_DATA&email=${encodeURIComponent(currentUser.email)}`)
                .then(response => response.json())
                .then(data => {
                    if(data.length === 0) {
                        container.innerHTML = `
                            <div class="flex flex-col items-center justify-center py-16 text-center">
                                <div class="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center mb-4">
                                    <i data-lucide="folder-search" class="w-8 h-8 text-gray-400"></i>
                                </div>
                                <h4 class="text-xl font-bold text-gray-900 mb-2">No Filings Found</h4>
                                <p class="text-base text-gray-500">You haven't filed any returns yet.</p>
                                <button onclick="openItrModal();" class="mt-6 bg-gray-900 text-white font-bold py-3.5 px-8 rounded-xl text-base hover:bg-black">File ITR Now</button>
                            </div>`;
                    } else {
                        container.innerHTML = '';
                        data.forEach(item => {
                            const dateStr = new Date(item.Date).toLocaleDateString('en-IN', {day: 'numeric', month:'short', year:'numeric'});
                            const card = `
                                <div class="bg-white p-5 rounded-[20px] shadow-sm border border-gray-100 flex items-center justify-between gap-4">
                                    <div class="flex items-center gap-4">
                                        <div class="w-14 h-14 bg-blue-50 rounded-xl flex items-center justify-center text-blue-600">
                                            <i data-lucide="file-check" class="w-7 h-7"></i>
                                        </div>
                                        <div>
                                            <h4 class="text-base font-bold text-gray-900">${item.FY} - ${item.HeadOfIncome}</h4>
                                            <p class="text-xs text-gray-500 font-mono mt-0.5">${item.AppNo}</p>
                                        </div>
                                    </div>
                                    <div class="text-right flex flex-col items-end">
                                        <span class="text-[10px] font-bold text-yellow-600 bg-yellow-50 px-2.5 py-1 rounded-md uppercase tracking-widest mb-1">${item.Status}</span>
                                        <span class="text-xs text-gray-400 font-medium">${dateStr}</span>
                                    </div>
                                </div>
                            `;
                            container.innerHTML += card;
                        });
                    }
                    lucide.createIcons();
                })
                .catch(err => { container.innerHTML = `<p class="text-center text-base text-red-500 font-bold py-10">Error loading data. Please try again later.</p>`; });
        }

        // -------------------------
        // MODALS & UTILS
        // -------------------------
        function openLoginModal() { document.getElementById('loginScreen').classList.remove('hidden'); document.getElementById('loginScreen').classList.add('flex'); setTimeout(() => { document.getElementById('loginScreen').style.opacity = '1'; }, 10); }
        function closeLoginModal() { document.getElementById('loginScreen').style.opacity = '0'; setTimeout(() => { document.getElementById('loginScreen').classList.add('hidden'); document.getElementById('loginScreen').classList.remove('flex'); }, 300); }
        function openMenu() { document.getElementById('sideMenu').classList.remove('hidden'); document.getElementById('sideMenu').classList.add('block'); }
        function closeMenu() { document.getElementById('sideMenu').classList.add('hidden'); document.getElementById('sideMenu').classList.remove('block'); }
        function openPaymentSuccessModal() { document.getElementById('paymentSuccessModal').classList.remove('hidden'); document.getElementById('paymentSuccessModal').classList.add('flex'); }
        function closePaymentSuccessModal() { document.getElementById('paymentSuccessModal').classList.add('hidden'); document.getElementById('paymentSuccessModal').classList.remove('flex'); }
        function closeItrSuccessModal() { document.getElementById('itrSuccessModal').classList.add('hidden'); document.getElementById('itrSuccessModal').classList.remove('flex'); }
        
        function openSearch() { goHome(); document.getElementById('searchModal').classList.remove('hidden'); document.getElementById('searchModal').classList.add('flex'); document.getElementById('searchInput').focus(); }
        function closeSearch() { document.getElementById('searchModal').classList.add('hidden'); document.getElementById('searchModal').classList.remove('flex'); }
        function openPaymentModal() { goHome(); document.getElementById('paymentModal').classList.remove('hidden'); document.getElementById('paymentModal').classList.add('flex'); }
        function closePaymentModal() { document.getElementById('paymentModal').classList.add('hidden'); document.getElementById('paymentModal').classList.remove('flex'); }
        function openUploadModal() { goHome(); document.getElementById('uploadModal').classList.remove('hidden'); document.getElementById('uploadModal').classList.add('flex'); }

        function showToast(message, isError = false, isSuccessGreen = false) {
            const toast = document.getElementById('toast');
            toast.className = 'toast'; 
            if (isError) { toast.classList.add('error'); toast.innerHTML = `<i data-lucide="alert-circle" class="w-6 h-6"></i> <span>${message}</span>`; } 
            else if (isSuccessGreen) { toast.classList.add('success'); toast.innerHTML = `<i data-lucide="check-circle" class="w-6 h-6"></i> <span>${message}</span>`; } 
            else { toast.classList.add('default'); toast.innerHTML = `<i data-lucide="info" class="w-6 h-6 text-white"></i> <span>${message}</span>`; }
            lucide.createIcons();
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3500);
        }

        function filterSearch() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let items = document.querySelectorAll('.search-item');
            items.forEach(item => {
                let text = item.querySelector('.search-text').innerText.toLowerCase();
                if(text.includes(input)) { item.style.display = 'flex'; } else { item.style.display = 'none'; }
            });
        }

        // PAYMENT LOGIC
        function updatePaymentUI() {
            let amt = parseFloat(document.getElementById('payAmount').value) || 0;
            let total = amt + (amt * 0.02); 
            document.getElementById('rzpBtnText').innerText = amt > 0 ? `Pay ₹${total.toFixed(2)} via Razorpay` : 'Pay via Razorpay';
            let name = document.getElementById('payName').value || '';
            let akn = document.getElementById('payAkn').value || '';
            let narration = (akn && name) ? `${akn} - ${name}` : (name || akn || '');
            document.getElementById('payNarration').value = narration;
            let upiBase = "upi://pay?pa=accountree@ybl&pn=Accountree&cu=INR";
            if(narration) upiBase += `&tn=${encodeURIComponent(narration)}`;
            document.getElementById('btnGpay').href = upiBase;
            document.getElementById('btnPhonePe').href = upiBase;
            document.getElementById('btnPaytm').href = upiBase;
            let upiQrStr = "upi://pay?pa=accountree@ybl&pn=Accountree&cu=INR";
            if(narration) upiQrStr += `&tn=${encodeURIComponent(narration)}`;
            document.getElementById('upiQrCode').src = "https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=" + encodeURIComponent(upiQrStr);
        }

        function payViaRazorpayLink() {
            let amt = parseFloat(document.getElementById('payAmount').value) || 0; let total = amt + (amt * 0.02); 
            let narration = document.getElementById('payNarration').value || '';
            let url = "https://razorpay.me/@cmtaxexperts";
            if(total > 0) { url += `?amount=${total.toFixed(2)}`; if(narration) url += `&description=${encodeURIComponent(narration)}`; }
            window.open(url, '_blank');
        }

        function calculateCountdown() {
            const targetDate = new Date("July 31, 2026 23:59:59").getTime();
            const now = new Date().getTime(); 
            let days = Math.floor((targetDate - now) / (1000 * 60 * 60 * 24)); days = days > 0 ? days : 0;
            document.getElementById('donutDaysLeft').innerText = days;
            const circle = document.getElementById('donutProgress');
            const totalDaysScale = 30; const radius = 42; const circumference = 2 * Math.PI * radius; 
            const progress = days / totalDaysScale; const safeProgress = Math.max(0, Math.min(1, progress));
            const offset = circumference - (safeProgress * circumference);
            setTimeout(() => { circle.style.strokeDashoffset = offset; }, 100);
        }

        let currentItrAppNo = '';
        function whatsappITR() {
            const text = encodeURIComponent(`Hello, I have successfully submitted my ITR Details.\n\n*Application No:* ${currentItrAppNo}\n\nPlease process this fast 🚀.`);
            window.open(`https://wa.me/919946151111?text=${text}`, '_blank');
        }

        // ITR FORM
        let currentStep = 1;
        function openItrModal() { 
            goHome();
            document.getElementById('itrForm').classList.remove('hidden'); document.getElementById('itrForm').classList.add('block');
            document.getElementById('itrModalNav').classList.remove('hidden'); document.getElementById('itrModalNav').classList.add('flex');
            document.getElementById('itrModalFooter').classList.remove('hidden'); document.getElementById('itrModalFooter').classList.add('block');
            document.getElementById('itrModal').classList.remove('hidden'); document.getElementById('itrModal').classList.add('flex'); 
            showStep(1); 
        }
        function closeItrModal() { document.getElementById('itrModal').classList.add('hidden'); document.getElementById('itrModal').classList.remove('flex'); }
        
        function showStep(step) {
            document.getElementById('step1').classList.add('hidden'); document.getElementById('step2').classList.add('hidden'); document.getElementById('step3').classList.add('hidden');
            document.getElementById('step' + step).classList.remove('hidden');
            for(let i=1; i<=3; i++) {
                const nav = document.getElementById('navStep'+i);
                if(i === step) { nav.classList.add('step-active'); nav.classList.remove('step-inactive'); }
                else { nav.classList.remove('step-active'); nav.classList.add('step-inactive'); }
            }
            const btnBack = document.getElementById('btnBack'); const btnNext = document.getElementById('btnNext'); const btnSubmit = document.getElementById('btnSubmit');
            if (step === 1) { btnBack.classList.add('hidden'); btnNext.classList.remove('hidden'); btnSubmit.classList.add('hidden'); }
            else if (step === 2) { btnBack.classList.remove('hidden'); btnNext.classList.remove('hidden'); btnSubmit.classList.add('hidden'); }
            else if (step === 3) { btnBack.classList.remove('hidden'); btnNext.classList.add('hidden'); btnSubmit.classList.remove('hidden'); }
            currentStep = step;
        }
        function nextStep() { showStep(currentStep + 1); }
        function prevStep() { showStep(currentStep - 1); }

        function readFileAsBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve({
                    base64: reader.result.split(',')[1],
                    mimeType: file.type,
                    fileName: file.name
                });
                reader.onerror = error => reject(error);
                reader.readAsDataURL(file);
            });
        }

        async function processFileInput(inputId) {
            const fileInput = document.getElementById(inputId);
            if (fileInput && fileInput.files.length > 0) {
                try {
                    return await readFileAsBase64(fileInput.files[0]);
                } catch(e) {
                    return "Error Reading File";
                }
            }
            return null;
        }

        async function submitItrFinal() {
            const btn = document.getElementById('btnSubmit'); 
            if (btn.disabled) return;
            
            const emailVal = (document.getElementById('s1_email').value || "").trim();
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            
            if(!document.getElementById('s1_name').value || !document.getElementById('s1_pan').value || !emailVal || !document.getElementById('s1_mobile').value || !document.getElementById('s2_fy').value || !document.getElementById('s2_head').value) {
                showToast("Please complete all mandatory fields (*).", true, false); 
                return;
            }
            if(!emailRegex.test(emailVal)) {
                showToast("Please enter a valid full email address (e.g., name@gmail.com)", true);
                return;
            }

            const originalText = btn.innerHTML;
            btn.innerHTML = `<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> Submitting...`;
            btn.disabled = true; lucide.createIcons();

            try {
                const bankFile = await processFileInput('s3_bank');
                const form16File = await processFileInput('s3_form16');
                const pnlFile = await processFileInput('s3_pnl');
                const othersFile = await processFileInput('s3_others');

                const appNo = getNextItrAppNo();
                currentItrAppNo = appNo;
                
                document.getElementById('payPan').value = document.getElementById('s1_pan').value.toUpperCase();
                document.getElementById('payMobile').value = document.getElementById('s1_mobile').value;
                document.getElementById('payName').value = document.getElementById('s1_name').value.trim();
                document.getElementById('payAkn').value = appNo;
                updatePaymentUI();

                const payload = {
                    "action": "ITR", "#TimeStamp": new Date().toISOString(), "ApplicationNo": appNo,
                    "Name": document.getElementById('s1_name').value.trim(), "Mobile": document.getElementById('s1_mobile').value,
                    "Email": emailVal.toLowerCase(), "PAN": document.getElementById('s1_pan').value.toUpperCase(),
                    "Password": "", "FY": document.getElementById('s2_fy').value,
                    "HeadOfIncome": document.getElementById('s2_head').value, "BankStatementURL": bankFile,
                    "Form16URL": form16File, "PnLURL": pnlFile, "OthersURL": othersFile,
                    "NameOfOtherStatement": document.getElementById('s3_other_name').value.trim()
                };

                fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload), mode: 'no-cors' })
                    .then(() => { handleItrSuccess(appNo); btn.disabled = false; btn.innerHTML = originalText; lucide.createIcons(); })
                    .catch(() => { handleItrSuccess(appNo); btn.disabled = false; btn.innerHTML = originalText; lucide.createIcons(); }); 

            } catch (error) { showToast("Error submitting application.", true, false); btn.disabled = false; btn.innerHTML = originalText; lucide.createIcons(); }
        }

        function handleItrSuccess(appNo) {
            closeItrModal(); 
            document.getElementById('successAppNo').innerText = appNo;
            document.getElementById('itrSuccessModal').classList.remove('hidden');
            document.getElementById('itrSuccessModal').classList.add('flex');
            document.getElementById('itrForm').reset();
            showToast(`App No: ${appNo} Submitted!`, false, true);
        }

        async function submitPaymentForm() {
            const btn = document.getElementById('paySubmitBtn'); 
            if (btn.disabled) return;
            
            const amt = document.getElementById('payAmount').value;
            const name = document.getElementById('payName').value;
            const pan = document.getElementById('payPan').value;
            const mobile = document.getElementById('payMobile').value;
            
            if(!amt || !name || !pan || !mobile) {
                showToast("Please fill all mandatory fields (*).", true);
                return;
            }

            const origText = btn.innerHTML;
            btn.innerHTML = `<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> Processing...`;
            btn.disabled = true; lucide.createIcons();

            try {
                const payProof = await processFileInput('payProof');
                const ptrnSeq = getNextTrnNo();
                
                const userAkn = document.getElementById('payAkn').value;
                const finalAkn = userAkn ? `${ptrnSeq}/${userAkn}` : ptrnSeq;

                const payload = {
                    "action": 'PAYMENT', "#TimeStamp": new Date().toISOString(), "Name": name, 
                    "PAN": pan, "Mobile": mobile, "AKN": finalAkn, "Amount": amt, "PaymentProof": payProof
                };

                fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload), mode: 'no-cors' })
                    .then(() => { 
                        closePaymentModal(); document.getElementById('successPtrnNo').innerText = finalAkn; openPaymentSuccessModal(); 
                        btn.disabled = false; btn.innerHTML = origText; lucide.createIcons();
                    })
                    .catch(() => { 
                        closePaymentModal(); document.getElementById('successPtrnNo').innerText = finalAkn; openPaymentSuccessModal(); 
                        btn.disabled = false; btn.innerHTML = origText; lucide.createIcons();
                    });
            } catch(e) { showToast("Error processing payment request.", true); btn.disabled = false; btn.innerHTML = origText; lucide.createIcons(); } 
        }

        async function submitUploadModal() {
            const btn = document.getElementById('uploadSubmitBtn');
            if(btn.disabled) return;
            const appNo = document.getElementById('uploadAppNo').value.trim();
            const fileInput = document.getElementById('uploadDocFile');
            if(!appNo || !fileInput.files.length) {
                showToast("Please provide Application No and choose a file", true);
                return;
            }
            const origText = btn.innerHTML;
            btn.innerHTML = `<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> Uploading...`;
            btn.disabled = true; lucide.createIcons();
            try {
                const docFile = await readFileAsBase64(fileInput.files[0]);
                const payload = { "action": "UPLOAD", "ApplicationNo": appNo, "DocumentFile": docFile };
                fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload), mode: 'no-cors' })
                    .then(() => { goHome(); showToast('Document Uploaded!', false, true); btn.disabled = false; btn.innerHTML = origText; lucide.createIcons(); })
                    .catch(() => { goHome(); showToast('Document Uploaded!', false, true); btn.disabled = false; btn.innerHTML = origText; lucide.createIcons(); });
            } catch(e) { showToast("Error uploading document", true); btn.disabled = false; btn.innerHTML = origText; lucide.createIcons(); }
        }

        function copyText(text) { navigator.clipboard.writeText(text).then(() => showToast("Copied to clipboard!", false, false)); }
