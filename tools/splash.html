<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CMCalc</title>

<style>
body{
margin:0;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
background:#fff;
font-family:Roboto,sans-serif;
flex-direction:column;
}

img.logo{
width:110px;
margin-bottom:25px;
}

img.name{
width:220px;
}

.loader{
margin-top:35px;
width:40px;
height:40px;
border:4px solid #eee;
border-top:4px solid #df483a;
border-radius:50%;
animation:spin 1s linear infinite;
}

@keyframes spin{
100%{transform:rotate(360deg);}
}
</style>

<script>
setTimeout(()=>{
location.href="index.html";
},2000);
</script>

</head>

<body>

<img src="assets/logo.png" class="logo">
<img src="assets/name.png" class="name">
<div class="loader"></div>

</body>
</html>
