<!doctype html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CM Calc</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root[data-theme="dark"] {
            /* Frame & Metal Background */
            --bg-base: #1a1b1c;
            --bg-metal-1: rgba(255,255,255,0.02);
            --text-header: #e0e0e0;
            --text-cm: #df483a;
            
            /* Menus and Modals */
            --menu-bg: #222325;
            --menu-text: #e0e0e0;
            --menu-border: #333333;
            --menu-hover: #333435;
            
            /* Screen: Dark Teal */
            --screen-bg: linear-gradient(180deg, #0f282f 0%, #12333b 100%);
            --screen-text: #ffffff;
            --screen-text-muted: #5e848d;
            --screen-border: #000000;
            --screen-divider: #264a52;
            
            /* Button Base */
            --btn-border: #050505;
            --btn-shadow: inset 0 1px 1px rgba(255,255,255,0.1), 0 3px 6px rgba(0,0,0,0.6);
            
            /* Button Variants */
            --btn-num: linear-gradient(180deg, #333435 0%, #1e1e1f 100%);
            --btn-num-text: #b3b3b3; /* Grey text in night mode */
            
            --btn-mem: linear-gradient(180deg, #363636 0%, #262626 100%);
            --btn-mem-text: #909090;
            
            --btn-op: linear-gradient(180deg, #325a74 0%, #1f4258 100%);
            --btn-op-text: #ffffff;
            
            --btn-red: linear-gradient(180deg, #c2463b 0%, #9c2e25 100%);
            --btn-red-text: #ffffff;
            
            --btn-orange: linear-gradient(180deg, #e29033 0%, #c16e15 100%);
            --btn-orange-text: #000000;
        }

        :root[data-theme="light"] {
            /* Frame & Metal Background */
            --bg-base: #e4e6e8;
            --bg-metal-1: rgba(0,0,0,0.03);
            --text-header: #111111;
            --text-cm: #db3a2b;
            
            /* Menus and Modals */
            --menu-bg: #f5f6f7;
            --menu-text: #111111;
            --menu-border: #caced1;
            --menu-hover: #e4e6e8;
            
            /* Screen: Light Blueish Grey */
            --screen-bg: linear-gradient(180deg, #a4c1cf 0%, #89adb9 100%);
            --screen-text: #111111;
            --screen-text-muted: #3a545e;
            --screen-border: #6c7d85;
            --screen-divider: #7598a6;
            
            /* Button Base */
            --btn-border: #99a2a8;
            --btn-shadow: inset 0 1px 2px rgba(255,255,255,0.9), 0 2px 4px rgba(0,0,0,0.25);
            
            /* Button Variants */
            --btn-num: linear-gradient(180deg, #f2f2f2 0%, #d8d8d8 100%);
            --btn-num-text: #111111; /* Black text in light mode */
            
            --btn-mem: linear-gradient(180deg, #a7b2c2 0%, #8b97a8 100%);
            --btn-mem-text: #ffffff;
            
            --btn-op: linear-gradient(180deg, #dce4ee 0%, #b8c6d8 100%);
            --btn-op-text: #111111;
            
            --btn-red: linear-gradient(180deg, #ef8a7a 0%, #db5b4a 100%);
            --btn-red-text: #111111;
            
            --btn-orange: linear-gradient(180deg, #fac680 0%, #ee9941 100%);
            --btn-orange-text: #111111;
        }

        * { 
            font-family: 'Roboto', sans-serif; 
            -webkit-tap-highlight-color: transparent; 
            box-sizing: border-box;
            transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
        }

        body { 
            /* Brushed metal effect */
            background-color: var(--bg-base);
            background-image: 
                repeating-linear-gradient(90deg, transparent 0px, transparent 1px, var(--bg-metal-1) 1px, var(--bg-metal-1) 3px),
                linear-gradient(180deg, rgba(255,255,255,0.05) 0%, rgba(0,0,0,0.05) 100%);
            margin: 0;
            height: 100dvh; 
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
        }

        /* Dynamic Grid */
        .keypad-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            grid-template-rows: 0.7fr repeat(5, 1fr);
            gap: 0.45rem;
            width: 100%;
            height: 100%;
        }

        /* 3D Button Style */
        .calc-btn {
            display: flex; align-items: center; justify-content: center;
            border-radius: 8px; font-weight: 500; /* Made buttons bolder */
            cursor: pointer; user-select: none;
            border: 1px solid var(--btn-border);
            box-shadow: var(--btn-shadow);
            touch-action: manipulation;
            transition: transform 0.05s ease, box-shadow 0.05s ease, filter 0.1s;
        }
        
        .calc-btn:active { 
            transform: translateY(2px); 
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.4), 0 1px 1px rgba(0,0,0,0.1);
            filter: brightness(0.9);
        }

        /* Specific Button Classes */
        .btn-num { background: var(--btn-num); color: var(--btn-num-text); font-size: 2.25rem; font-weight: 500; }
        .btn-mem { background: var(--btn-mem); color: var(--btn-mem-text); font-size: 1.25rem; font-weight: 500; }
        .btn-op { background: var(--btn-op); color: var(--btn-op-text); font-size: 2.25rem; }
        .btn-red { background: var(--btn-red); color: var(--btn-red-text); font-size: 2.25rem; }
        .btn-orange { background: var(--btn-orange); color: var(--btn-orange-text); font-size: 2.25rem; }
        
        /* The Display Screen */
        .display-box {
            background: var(--screen-bg);
            border: 2px solid var(--screen-border);
            border-radius: 6px;
            box-shadow: inset 0 4px 12px rgba(0,0,0,0.25), 0 1px 1px rgba(255,255,255,0.05);
        }

        .truncate-custom {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .hover-menu:hover {
            background-color: var(--menu-hover);
        }
    </style>
</head>

<body class="w-full p-3 sm:p-4">
    <main class="w-full max-w-[400px] flex flex-col gap-3 flex-1 mx-auto h-full relative">
        
        <header class="flex items-center justify-between px-1 pt-1 flex-shrink-0 relative z-40">
            <i data-lucide="menu" class="w-7 h-7 cursor-pointer" style="color: var(--text-header);"></i>
            <h1 class="text-xl tracking-wide font-normal" style="color: var(--text-header);">
                <span class="font-bold" style="color: var(--text-cm);">CM</span> Calc
            </h1>
            
            <div class="flex items-center gap-2">
                <button onclick="toggleTheme()" class="focus:outline-none p-2 rounded-lg border flex items-center justify-center active:scale-90 transition-transform" style="background: var(--btn-num); border-color: var(--btn-border); box-shadow: var(--btn-shadow);">
                    <i data-lucide="sun" id="themeToggleIcon" class="w-4 h-4" style="color: var(--btn-num-text);"></i>
                </button>
                
                <button onclick="toggleMenu(event)" class="focus:outline-none p-1 rounded-full">
                    <i data-lucide="more-vertical" class="w-7 h-7 cursor-pointer" style="color: var(--text-header);"></i>
                </button>
            </div>

            <div id="dropdownMenu" class="hidden absolute top-12 right-0 rounded-lg shadow-2xl border p-1 min-w-[140px] transition-colors z-50" style="background: var(--menu-bg); color: var(--menu-text); border-color: var(--menu-border);">
                <div class="py-2.5 px-3 cursor-pointer rounded text-base font-medium transition-colors hover-menu" onclick="showAbout()">
                    About App
                </div>
                <div class="w-full border-t my-1" style="border-color: var(--menu-border);"></div>
                <div class="py-2 px-3 text-sm font-medium opacity-60 pointer-events-none">
                    Version 1.0
                </div>
            </div>
        </header>
        
        <div class="display-box px-4 py-3 flex flex-col justify-center flex-shrink-0 min-h-[140px] h-[20vh] relative z-10">
            <div id="result" class="w-full text-right text-[3.25rem] leading-none font-light tracking-tight truncate-custom mb-2" style="color: var(--screen-text);">
                0
            </div>
            
            <div class="w-full border-t" style="border-color: var(--screen-divider);"></div>
            
            <div id="expression" class="w-full text-right text-2xl font-light mt-1 min-h-[2rem] truncate-custom" style="color: var(--screen-text-muted);">
                &nbsp;
            </div>
        </div>

        <div class="flex-1 min-h-0 w-full pb-2 mt-1 z-10">
            <div class="keypad-grid">
                <button class="calc-btn btn-mem" onclick="mem('mc')">mc</button> 
                <button class="calc-btn btn-mem" onclick="mem('m+')">m+</button> 
                <button class="calc-btn btn-mem" onclick="mem('m-')">m-</button> 
                <button class="calc-btn btn-mem" onclick="mem('mr')">mr</button>
                
                <button class="calc-btn btn-red" onclick="calc('C')">C</button> 
                <button class="calc-btn btn-num" onclick="calc('%')">%</button> 
                <button class="calc-btn btn-num" onclick="calc('+/-')">+/−</button> 
                <button class="calc-btn btn-op" onclick="calc('/')">÷</button> 
                
                <button class="calc-btn btn-num" onclick="calc('7')">7</button> 
                <button class="calc-btn btn-num" onclick="calc('8')">8</button> 
                <button class="calc-btn btn-num" onclick="calc('9')">9</button> 
                <button class="calc-btn btn-op" onclick="calc('*')">×</button> 
                
                <button class="calc-btn btn-num" onclick="calc('4')">4</button> 
                <button class="calc-btn btn-num" onclick="calc('5')">5</button> 
                <button class="calc-btn btn-num" onclick="calc('6')">6</button> 
                <button class="calc-btn btn-op" onclick="calc('-')">−</button> 
                
                <button class="calc-btn btn-num" onclick="calc('1')">1</button> 
                <button class="calc-btn btn-num" onclick="calc('2')">2</button> 
                <button class="calc-btn btn-num" onclick="calc('3')">3</button> 
                <button class="calc-btn btn-op" onclick="calc('+')">+</button> 
                
                <button class="calc-btn btn-num" onclick="calc('0')">0</button> 
                <button class="calc-btn btn-num" onclick="calc('.')">.</button> 
                
                <button class="calc-btn btn-num flex justify-center items-center" onclick="calc('back')">
                    <svg class="w-8 h-8 opacity-80" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                        <path d="M22 3H7C6.3 3 5.7 3.4 5.4 4L0 12L5.4 20C5.7 20.6 6.3 21 7 21H22C23.1 21 24 20.1 24 19V5C24 3.9 23.1 3 22 3ZM18.3 16.3L15.5 13.5L12.7 16.3L11.3 14.9L14.1 12.1L11.3 9.3L12.7 7.9L15.5 10.7L18.3 7.9L19.7 9.3L16.9 12.1L19.7 14.9L18.3 16.3Z"/>
                    </svg>
                </button> 
                
                <button class="calc-btn btn-orange font-bold" onclick="calc('=')">=</button>
            </div>
        </div>
    </main>

    <div id="aboutModal" class="hidden fixed inset-0 z-[100] flex items-center justify-center bg-black/60 backdrop-blur-sm px-4 opacity-0 transition-opacity duration-300">
        <div class="rounded-xl shadow-2xl p-6 w-full max-w-[320px] text-center transform scale-95 transition-transform duration-300" style="background: var(--menu-bg); border: 1px solid var(--menu-border);">
            <h2 class="text-3xl font-normal mb-1" style="color: var(--text-header);"><span class="font-bold" style="color: var(--text-cm);">CM</span> Calc</h2>
            <p class="text-sm mb-5" style="color: var(--screen-text-muted);">Classic. Simple. Powerful.</p>
            <p class="text-base font-medium mb-6" style="color: var(--text-header);">Version 1.0</p>
            <button onclick="closeAbout()" class="w-full py-2.5 rounded-lg font-bold transition-transform active:scale-95 shadow-md" style="background: var(--btn-orange); color: var(--btn-orange-text);">Close</button>
        </div>
    </div>

    <script>
        // Initialize Icons
        lucide.createIcons();

        // Menu Dropdown Logic
        const dropdownMenu = document.getElementById('dropdownMenu');
        function toggleMenu(event) {
            event.stopPropagation();
            dropdownMenu.classList.toggle('hidden');
        }
        
        // Hide menu on outside click
        document.addEventListener('click', (event) => {
            if (!dropdownMenu.contains(event.target) && !dropdownMenu.classList.contains('hidden')) {
                dropdownMenu.classList.add('hidden');
            }
        });

        // About Modal Logic
        const aboutModal = document.getElementById('aboutModal');
        const modalContent = aboutModal.querySelector('div');
        
        function showAbout() {
            dropdownMenu.classList.add('hidden');
            aboutModal.classList.remove('hidden');
            // Small delay to allow CSS transitions to trigger
            setTimeout(() => {
                aboutModal.classList.remove('opacity-0');
                modalContent.classList.remove('scale-95');
            }, 10);
        }

        function closeAbout() {
            aboutModal.classList.add('opacity-0');
            modalContent.classList.add('scale-95');
            setTimeout(() => {
                aboutModal.classList.add('hidden');
            }, 300);
        }

        // Theme Toggle Logic
        let isDark = true;
        function toggleTheme() {
            isDark = !isDark;
            const theme = isDark ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', theme);
            
            const toggleIcon = document.getElementById('themeToggleIcon');
            toggleIcon.setAttribute('data-lucide', isDark ? 'sun' : 'moon');
            lucide.createIcons();
        }

        // Calculator Logic
        let current = '0', prev = '', op = '', reset = false, memory = 0;
        const resultEl = document.getElementById('result');
        const exprEl = document.getElementById('expression');

        function fmt(n) {
            let num = parseFloat(n);
            if (isNaN(num)) return '0';
            return num.toLocaleString('en-US', { maximumFractionDigits: 8 });
        }

        function updateDisplay() {
            if (current.endsWith('.')) {
                resultEl.textContent = fmt(current.slice(0, -1)) + '.';
            } else if (current.includes('.') && current.endsWith('0')) {
                resultEl.textContent = current; 
            } else {
                resultEl.textContent = fmt(current);
            }
        }

        function calc(key) {
            if (key === 'C') { 
                current = '0'; prev = ''; op = ''; reset = false; exprEl.innerHTML = '&nbsp;'; 
            }
            else if (key === '+/-') { 
                current = String(-parseFloat(current || 0)); 
            }
            else if (key === '%') { 
                current = String(parseFloat(current || 0) / 100); 
            }
            else if (key === 'back') {
                if (current.length > 1) {
                    current = current.slice(0, -1);
                    if (current === '-') current = '0';
                }
                else current = '0';
            }
            else if (['+','-','*','/'].includes(key)) {
                if (op && prev && !reset) {
                    current = String(eval(prev + op + current));
                }
                prev = current; op = key;
                let sym = {'+':'+','-':'−','*':'×','/':'÷'}[key];
                // Put expression at the bottom
                exprEl.textContent = fmt(prev) + ' ' + sym;
                reset = true;
            }
            else if (key === '=') {
                if (op && prev) {
                    let sym = {'+':'+','-':'−','*':'×','/':'÷'}[op];
                    exprEl.textContent = fmt(prev) + ' ' + sym + ' ' + fmt(current);
                    
                    let safePrev = parseFloat(prev);
                    let safeCurr = parseFloat(current);
                    let evalResult = 0;
                    
                    if(op === '+') evalResult = safePrev + safeCurr;
                    if(op === '-') evalResult = safePrev - safeCurr;
                    if(op === '*') evalResult = safePrev * safeCurr;
                    if(op === '/') evalResult = safePrev / safeCurr;
                    
                    current = String(evalResult);
                    op = ''; prev = '';
                }
            } else {
                if (reset) { current = ''; reset = false; }
                if (key === '.' && current.includes('.')) return;
                current = (current === '0' && key !== '.') ? key : current + key;
            }
            updateDisplay();
        }

        function mem(key) {
            if (key === 'mc') {
                memory = 0;
            }
            else if (key === 'm+') {
                memory += parseFloat(current) || 0;
                reset = true;
            }
            else if (key === 'm-') {
                memory -= parseFloat(current) || 0;
                reset = true;
            }
            else if (key === 'mr') { 
                current = String(memory); 
                reset = false; 
                updateDisplay(); 
            }
        }
    </script>
</body>
</html>
